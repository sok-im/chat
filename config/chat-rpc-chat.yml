rpc:
  # The IP address where this RPC service registers itself; if left blank, it defaults to the internal network IP
  registerIP: ''
  # IP address that the RPC service listens on; setting to 0.0.0.0 listens on both internal and external IPs. If left blank, it automatically uses the internal network IP
  listenIP: 0.0.0.0
  # List of ports that the RPC service listens on; configuring multiple ports will launch multiple instances.
  ports: [ 30300 ]

prometheus:
  enable: true
  ports: [ 32300 ]

verifyCode:
  validTime: 300
  validCount: 5
  uintTime: 86400
  maxCount: 1000
  needVerifyCaptchaCount: 10
  superCode: "666666"
  len: 6
  phone:
    use: "" # "ali" | "twilio" | "telnyx" | empty (SMS disabled; superCode only if mail also off)
    ali:
      endpoint: ""
      accessKeyId: ""
      accessKeySecret: ""
      signName: ""
      verificationCodeTemplateCode: ""
    twilio:
      accountSid: ""
      authToken: ""
      # Twilio-owned number in E.164, e.g. "+12025551234", or Messaging Service SID "MG..."
      from: ""
      body: "Your verification code is: %s"
      bodyTemplates:
        default: "Your verification code is: %s"
        en: "Your verification code is: %s"
        zh-cn: "您的验证码是：%s"
      defaultLanguage: "en"
    telnyx:
      apiKey: ""
      # Telnyx-owned number in E.164, e.g. "+12025551234", or set messagingProfileId instead of from
      from: ""
      messagingProfileId: ""
      body: "Your verification code is: %s"
      bodyTemplates:
        default: "Your verification code is: %s"
        en: "Your verification code is: %s"
        zh-cn: "您的验证码是：%s"
      defaultLanguage: "en"
  mail:
    enable: false
    title: ""
    senderMail: ""
    senderAuthorizationCode: ""
    smtpAddr: ""
    smtpPort:

liveKit:
  url: "ws://127.0.0.1:7880" # LIVEKIT_URL, LiveKit server address and port
  key: ""
  secret: ""

allowRegister: true
maxAccountsPerPhone: 2

miniProgram:
  # Master switch for the FinClip mini-program capability. When false the App
  # hides the entry and the catalog is not served.
  enabled: true
  # Whether the remote catalog is served (false => client falls back to built-in placeholder).
  catalogEnabled: true
  # Allow opening cached entries that do not require sok.getSession while offline.
  allowOfflineOpen: false
  # Clients below this version are prompted to upgrade the whole App.
  minClientVersion: "1.0.0"
  # Suggested client-side catalog cache TTL in seconds.
  cacheTtlSeconds: 600
  # Salt for deriving the pseudonymous per-app subject. NOT exposed to clients; rotate as needed.
  ticketSecret: ""
  # Business ticket lifetime in seconds (default 300, capped at 900).
  ticketTtlSeconds: 300
  # Launch config lifetime in seconds (default 300).
  launchTtlSeconds: 300
