rpc:
  # The IP address where this RPC service registers itself; if left blank, it defaults to the internal network IP
  registerIP: ''
  # IP address that the RPC service listens on; setting to 0.0.0.0 listens on both internal and external IPs. If left blank, it automatically uses the internal network IP
  listenIP: 0.0.0.0
  # List of ports that the RPC service listens on; configuring multiple ports will launch multiple instances.
  ports: [ 30300 ]

verifyCode:
  validTime: 300
  validCount: 5
  uintTime: 86400
  maxCount: 10
  verifyMinuteCount: 0
  superCode: "666666"
  len: 6
  phone:
    use: "" # "ali" | "twilio" | empty (SMS disabled; superCode only if mail also off)
    ali:
      endpoint: ""
      accessKeyId: ""
      accessKeySecret: ""
      signName: ""
      verificationCodeTemplateCode: ""
    twilio:
      accountSid: ""
      authToken: ""
      # Twilio-owned number in E.164, e.g. "+12025551234", or Messaging Service SID "MG..."
      from: ""
      # Single default template (printf, include %s for code). Ignored as default if bodyTemplates has key "default".
      body: ""
      # Per-language SMS body; keys are BCP 47 tags (case-insensitive), e.g. default, en, zh-cn. Each value must contain %s (or other printf verb) for the code.
      bodyTemplates: {}
      # When SendVerifyCode language is empty or unknown, try this tag before "default" (e.g. en).
      defaultLanguage: ""
  mail:
    enable: false
    title: ""
    senderMail: ""
    senderAuthorizationCode: ""
    smtpAddr: ""
    smtpPort:

liveKit:
  url: "ws://127.0.0.1:7880" # LIVEKIT_URL, LiveKit server address and port
  key: "APIGPW3gnFTzqHH"
  secret: "23ztfSqsfQ8hKkHzHTl3Z4bvaxro0snjk5jwbp5p6Q3"

allowRegister: true
maxAccountsPerPhone: 2
